<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="topbar" id="topbar">
        <div class="topbar-logo">P.GIT</div>

        <div class="topbar-dropdown-container" id="repositories-container">
            <button class="topbar-btn">
                <div class="btn-text-group">
                    <span class="topbar-dropdown btn-label">Current repository: </span>
                    <span class="topbar-dropdown btn-value">None</span>
                </div>
                <div class="btn-arrow"></div>
            </button>

            <div class="dropdown-panel" id="repository-dropdown-panel">
                <div class="filter-container" id="repositories-filter">
                    <div class="icon-filter"></div>
                    <input type="text" class="filter-input" placeholder="Search" />

                    <button class="topbar-filter-btn btn-add">Add</button>
                </div>

                <!-- <div class="dropdown-item active">my-web-app</div> -->
                <!-- <div class="dropdown-item">parek-tui</div > -->


            </div>

        </div>

        <div class="topbar-dropdown-container" id="branches-container">
            <button class="topbar-btn">
                <div class="btn-text-group">
                    <span class="topbar-dropdown btn-label">Current branch: </span>
                    <span class="topbar-dropdown btn-value">None</span>
                </div>
                <div class="btn-arrow"></div>
            </button>

            <div class="dropdown-panel" id="branch-dropdown-panel">
                <div class="filter-container" id="branches-filter">
                    <div class="icon-filter"></div>
                    <input type="text" class="filter-input" placeholder="Search" />

                    <button class="topbar-filter-btn btn-new">New</button>
                </div>

                <!-- <div class="dropdown-item">main</div> -->
                <!-- <div class="dropdown-item">testing</div> -->
                <!-- <div class="dropdown-item active">bugfixes/bugs</div> -->


            </div>

        </div>

    </div>

    <div class="dropdown-backdrop" id="dropdown-backdrop"></div>

    <div class="app-container">
        <div class="left-sidebar" id="left-sidebar">
            <button class="left-sidebar-btn btn-file">
                <div class="btn-icon icon-file"></div>
            </button>

            <button class="left-sidebar-btn btn-branches">
                <div class="btn-icon icon-branches"></div>
            </button>

            <button class="left-sidebar-btn btn-analytics">
                <div class="btn-icon icon-analytics"></div>
            </button>

            <button class="left-sidebar-btn btn-todo">
                <div class="btn-icon icon-todo"></div>
            </button>

            <button class="left-sidebar-btn btn-fetch">
                <div class="btn-icon icon-fetch"></div>
            </button>

        </div>

        <div class="split-container">
            <div class="main-content" id="main-content">

            </div>

            <div class="resizer" id="resizer"></div>

            <div class="right-sidebar" id="right-sidebar">
                <div class="right-sidebar-bottom">
                    <input type="text" class="commit-input message-input" placeholder="Message (required)"/>

                    <textarea class="commit-input description-input" placeholder="Description"></textarea>

                    <button class="commit-btn">
                        Commit X files to <strong>[branch]</strong>
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
