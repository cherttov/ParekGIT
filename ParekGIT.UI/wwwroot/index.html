<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css"/>
</head>
<body>
    <div class="topbar" id="topbar">
        <div class="topbar-logo">P.GIT</div>

        <div class="topbar-dropdown-container" id="repositories-container">
            <button class="topbar-btn">
                <div class="btn-text-group">
                    <span class="topbar-dropdown btn-label">Current repository: </span>
                    <span class="topbar-dropdown btn-value">None</span>
                </div>
                <div class="btn-arrow"></div>
            </button>

            <div class="dropdown-panel" id="repository-dropdown-panel">
                <div class="filter-container" id="repositories-filter">
                    <div class="icon-filter"></div>
                    <input type="text" class="filter-input" placeholder="Search" />

                    <button class="topbar-filter-btn btn-add">
                        Add
                        <div class="btn-arrow"></div>
                    </button>

                </div>

                <!-- <div class="dropdown-item active">my-web-app</div> -->
                <!-- <div class="dropdown-item">parek-tui</div > -->


            </div>

        </div>

        <div class="topbar-dropdown-container" id="branches-container">
            <button class="topbar-btn">
                <div class="btn-text-group">
                    <span class="topbar-dropdown btn-label">Current branch: </span>
                    <span class="topbar-dropdown btn-value">None</span>
                </div>
                <div class="btn-arrow"></div>
            </button>

            <div class="dropdown-panel" id="branch-dropdown-panel">
                <div class="filter-container" id="branches-filter">
                    <div class="icon-filter"></div>
                    <input type="text" class="filter-input" placeholder="Search" />

                    <button class="topbar-filter-btn btn-new">New</button>
                </div>

                <!-- <div class="dropdown-item">main</div> -->
                <!-- <div class="dropdown-item active">bugfixes/bugs</div> -->


            </div>

        </div>

    </div>

    <div class="dropdown-backdrop" id="dropdown-backdrop"></div>

    <div class="modals">
        <div class="modal-backdrop" id="branch-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create new branch</h3>
                    <button class="close-modal-icon">&times;</button>
                </div>

                <div class="modal-body">
                    <div class="modal-body-row">
                        <label>Name</label>
                        <input type="text" class="modal-input" placeholder="new branch name" />
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="confirm-modal-btn">Create branch</button>
                    <button class="cancel-modal-btn">Cancel</button>
                </div>

            </div>

        </div>

        <div class="modal-backdrop" id="repo-create-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Create a new repository</h3>
                    <button class="close-modal-icon">&times;</button>
                </div>

                <div class="modal-body">
                    <div class="modal-body-row">
                        <label>Name</label>
                        <input type="text" class="modal-input input-name" placeholder="repository name"/>
                    </div>

                    <div class="modal-body-row">
                        <label>Description</label>
                        <input type="text" class="modal-input input-description"/>
                    </div>

                    <div class="modal-body-row">
                        <label>Local path</label>
                        <input type="text" class="modal-input input-path" placeholder="repository path"/>
                    </div>

                    <div class="modal-body-row">
                        <label>Git ignore</label>
                        <select id="select-git-ignore" class="modal-input">
                            <option value="none-gitignore">None</option>
                        </select>
                    </div>

                    <div class="modal-body-row">
                        <label>License</label>
                        <select id="select-git-license" class="modal-input">
                            <option value="none-license">None</option>
                        </select>
                    </div>
                </div>

                <div class="modal-footer">
                    <button class="confirm-modal-btn">Create repository</button>
                    <button class="cancel-modal-btn">Cancel</button>
                </div>

            </div>

        </div>

        <div class="modal-backdrop" id="repo-add-modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Add local repository</h3>
                    <button class="close-modal-icon">&times;</button>
                </div>

                <div class="modal-body">
                    <div class="modal-body-row">
                        <label>Local path</label>
                        <input type="text" class="modal-input" placeholder="repository path" />
                    </div>

                </div>

                <div class="modal-footer">
                    <button class="confirm-modal-btn">Add repository</button>
                    <button class="cancel-modal-btn">Cancel</button>
                </div>

            </div>

        </div>

    </div>


    <div class="app-container">
        <div class="left-sidebar" id="left-sidebar">
            <button class="left-sidebar-btn btn-file">
                <div class="btn-icon icon-file"></div>
            </button>

            <button class="left-sidebar-btn btn-branches">
                <div class="btn-icon icon-branches"></div>
            </button>

            <button class="left-sidebar-btn btn-analytics">
                <div class="btn-icon icon-analytics"></div>
            </button>

            <button class="left-sidebar-btn btn-todo">
                <div class="btn-icon icon-todo"></div>
            </button>

            <button class="left-sidebar-btn btn-fetch">
                <div class="btn-icon icon-fetch"></div>
            </button>

        </div>

        <div class="split-container">
            <div class="main-content" id="main-content">

            </div>

            <div class="resizer" id="resizer"></div>

            <div class="right-sidebar" id="right-sidebar">
                <div class="right-sidebar-bottom">
                    <input type="text" class="commit-input message-input" placeholder="Message (required)"/>

                    <textarea class="commit-input description-input" placeholder="Description"></textarea>

                    <button class="commit-btn">
                        Commit X files to <strong>[branch]</strong>
                    </button>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
